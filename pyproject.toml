[project]
name = "ejota-rede"
version = "0.1.0"
description = "Rede neural da Ejota: relatório de atrasos de projetos com causa e evidência"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
ia = ["anthropic>=0.60"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ejota*"]

[tool.setuptools.package-data]
ejota = ["templates/*.html", "static/*", "data/fake/*.json", "data/fake/docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
